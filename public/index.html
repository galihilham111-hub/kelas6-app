<script>
const sb=supabase.createClient('https://mxfrivytnjseizoyahls.supabase.co','sb_publishable_ymPmz2rktzI2-mK1dvwieQ_2pSgb_gm');
const $=s=>document.querySelector(s),app=$('#app');

const Q=[

{k:'perasaan_sekarang',t:'Sekarang di sekolah, perasaanmu bagaimana?',o:M},
{k:'alasan',t:'Mau cerita sedikit? (boleh langsung lanjut)',multi:1,
 if:a=>a.perasaan_berangkat<=2||a.perasaan_sekarang<=2,
 o:[['kurang_tidur','😴 Kurang tidur'],['belum_sarapan','🍽️ Belum sarapan'],['sedang_sakit','🤒 Sedang sakit'],['masalah_di_rumah','🏠 Ada masalah di rumah'],['terburu_buru','🏃 Terburu-buru'],['tidak_ingin_bilang','🤐 Tidak ingin bilang'],['ingin_bicara','💬 Aku ingin bicara dengan guru']]},
{k:'sarapan',t:'Tadi pagi sudah sarapan?',o:[['sudah','🍚 Sudah'],['sedikit','🥣 Sedikit'],['belum','🙈 Belum']]},
{k:'tidur',t:'Tidurmu semalam?',o:[['cukup','😊 Cukup'],['agak_kurang','😐 Agak kurang'],['sangat_kurang','😴 Sangat kurang']]},
{k:'badan',t:'Badanmu hari ini?',o:[['segar','💪 Segar'],['agak_lelah','😮‍💨 Agak lelah'],['kurang_enak','🤒 Kurang enak badan']]},
{k:'semangat',t:'Seberapa penuh baterai semangatmu hari ini?',o:[[1,'🪫 1 - hampir habis'],[2,'🔋 2'],[3,'🔋 3'],[4,'🔋 4'],[5,'⚡ 5 - penuh!']]},
{k:'gaya_belajar',t:'Hari ini aku ingin belajar dengan…',o:[['bermain','🎮 Bermain'],['menggambar','🎨 Menggambar'],['bergerak','🏃 Bergerak'],['mendengar_cerita','🎧 Mendengar cerita'],['berdiskusi','💬 Berdiskusi'],['mencoba_langsung','🔧 Mencoba langsung']]},
{k:'preferensi_kerja',t:'Aku lebih nyaman bekerja…',o:[['sendiri','🧍 Sendiri'],['berpasangan','👫 Berpasangan'],['kelompok','👥 Kelompok']]},
{k:'tema_favorit',t:'Pilih sampai 3 tema favoritmu',multi:1,max:3,o:[['olahraga','⚽ Olahraga'],['game','🎮 Game'],['musik','🎵 Musik'],['hewan','🐾 Hewan'],['teknologi','💻 Teknologi'],['alam','🌳 Alam'],['seni','🎨 Seni'],['memasak','🍳 Memasak']]},
{k:'kebutuhan_hari_ini',t:'Kalau boleh memilih, hari ini aku paling ingin…',o:[['ditantang','🚀 Ditantang'],['dibantu','🤝 Dibantu pelan-pelan'],['bermain','🎲 Bermain sambil belajar'],['bersama_teman','👭 Bekerja bersama teman']]}
];
const MSG={sesi_tidak_ditemukan:'Kode sesi tidak ditemukan atau sesi sudah ditutup.',kartu_tidak_dikenal:'Kartu tidak dikenal. Coba ketik kode pendek di kartu.',terlalu_banyak_percobaan:'Terlalu banyak percobaan. Tunggu beberapa menit.'};
let S={};
async function R(n,a){const{data,error}=await sb.rpc(n,a);if(error)throw error;return data}
function galat(f){app.innerHTML='<div class=c><h2>Sinyal bermasalah 📶</h2><button class=b id=rt>Coba lagi</button></div>';$('#rt').onclick=f}

function masuk(m){
 app.innerHTML=`<div class=c><h1>🚀 Misi Harian</h1>${m?`<p class=e>${m}</p>`:''}<input id=ks placeholder="Kode sesi" maxlength=6 value="${esc(P.get('s')||'')}"><input id=kk placeholder="Kode kartu / isi QR" maxlength=40><button class=b id=go>Mulai</button><button class="b g" id=sc>📷 Pindai QR kartu</button><video id=v hidden playsinline></video></div>`;
 $('#go').onclick=async()=>{try{
  const d=await R('siswa_masuk',{p_kode_sesi:$('#ks').value,p_kode_kartu:$('#kk').value});
  if(d.status=='sudah_selesai')return selesai(d.nama_panggilan,1);
  if(d.status!='ok')return masuk(MSG[d.status]||'Coba lagi.');
  S={tok:d.token,nama:d.nama_panggilan,a:{},i:0};d.langkah=='misi'?misi():cek();
 }catch(e){masuk('Sinyal bermasalah, coba lagi.')}};
 $('#sc').onclick=async()=>{
  if(!('BarcodeDetector' in window))return alert('Pemindai tidak didukung di perangkat ini. Ketik kode pendek di bawah QR pada kartu.');
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#v');
   v.hidden=false;v.srcObject=st;await v.play();const d=new BarcodeDetector({formats:['qr_code']});
   const t=setInterval(async()=>{const r=await d.detect(v).catch(()=>[]);
    if(r[0]){clearInterval(t);st.getTracks().forEach(x=>x.stop());$('#kk').value=r[0].rawValue;$('#go').click()}},400);
  }catch(e){alert('Kamera tidak bisa dibuka.')}};
}
function cek(){
 while(S.i<Q.length&&Q[S.i].if&&!Q[S.i].if(S.a))S.i++;
 if(S.i>=Q.length)return kirimCek();
 const q=Q[S.i];S.sel=[];
 app.innerHTML=`<div class=c><div class=bar><i style="width:${S.i/Q.length*100}%"></i></div><h1>Hai ${esc(S.nama)}! 👋</h1><h2>${q.t}</h2>${q.o.map((o,j)=>`<button class="b o" data-j="${j}">${o[1]}</button>`).join('')}${q.multi?'<button class=b id=nx>Lanjut ➜</button>':''}</div>`;
 app.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
  const v=q.o[b.dataset.j][0];
  if(!q.multi){S.a[q.k]=v;S.i++;return cek()}
  const x=S.sel.indexOf(v);
  if(x<0){if(S.sel.length<(q.max||9))S.sel.push(v)}else S.sel.splice(x,1);
  b.classList.toggle('on',S.sel.includes(v));
 });
 if(q.multi)$('#nx').onclick=()=>{S.a[q.k]=S.sel;S.i++;cek()};
}
async function kirimCek(){
 app.innerHTML='<div class=c><h2>Menyimpan…</h2></div>';
 const a={...S.a},al=a.alasan||[];a.ingin_bicara=al.includes('ingin_bicara');a.alasan=al.filter(x=>x!='ingin_bicara');
 try{await R('simpan_cek_diri',{p_token:S.tok,p_data:a});misi()}catch(e){galat(kirimCek)}
}
async function misi(){
 try{const d=await R('ambil_misi',{p_token:S.tok});S.m=d.soal;S.n=0;S.j=[];
  if(!S.m.length){await R('kirim_misi',{p_token:S.tok,p_jawaban:[]});return selesai(S.nama)}
  soal();
 }catch(e){galat(misi)}
}
function soal(){
 const q=S.m[S.n],o=[0,1,2,3].sort(()=>Math.random()-.5);
 app.innerHTML=`<div class=c><div class=bar><i style="width:${S.n/S.m.length*100}%"></i></div><h2>🎯 Misi ${S.n+1}/${S.m.length}</h2>${q.bacaan?`<div class=k>${esc(q.bacaan)}</div>`:''}<h3>${esc(q.pertanyaan)}</h3>${o.map(i=>`<button class="b o" data-i="${i}">${esc(q.opsi[i])}</button>`).join('')}</div>`;
 app.querySelectorAll('.o').forEach(b=>b.onclick=()=>{S.j.push({soal_id:q.id,pilihan:+b.dataset.i});S.n++;S.n<S.m.length?soal():kirimM()});
}
async function kirimM(){
 app.innerHTML='<div class=c><h2>Mengirim…</h2></div>';
 try{await R('kirim_misi',{p_token:S.tok,p_jawaban:S.j});selesai(S.nama)}catch(e){galat(kirimM)}
}
function selesai(n,sudah){
 app.innerHTML=`<div class=c><h1>🎉 Misi selesai!</h1><p>${sudah?'Kamu sudah mengisi hari ini, ':'Terima kasih, '}${esc(n)}!</p></div>`;
 setTimeout(()=>masuk(),5000);
}

/* ================= GURU ================= */
let K,SW=[],SS=null,tab='d',tm;
async function guru(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session)return login();
 const{data:k}=await sb.from('kelas').select('*').limit(1);
 if(!k||!k.length){await sb.auth.signOut();return login('Akun ini belum terdaftar sebagai guru.')}
 K=k[0];await muat();ui();
}
function login(m){
 app.innerHTML=`<div class=c><h1>Masuk Guru</h1>${m?`<p class=e>${esc(m)}</p>`:''}<input id=em type=email placeholder=Email><input id=pw type=password placeholder="Kata sandi"><button class=b id=go>Masuk</button></div>`;
 $('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?login('Email atau kata sandi salah.'):guru()};
}
async function muat(){
 const{data:s}=await sb.from('siswa').select('*').eq('kelas_id',K.id).order('no_absen');SW=s||[];
 const hr=new Date().toLocaleDateString('sv',{timeZone:'Asia/Jakarta'});
 const{data:z}=await sb.from('sesi_harian').select('*').eq('kelas_id',K.id).eq('tanggal',hr);SS=z&&z[0]||null;
 if(SS){const[a,b]=await Promise.all([sb.from('sesi_siswa').select('*').eq('sesi_id',SS.id),sb.from('cek_diri').select('*').eq('sesi_id',SS.id)]);
  SS.ss=Object.fromEntries((a.data||[]).map(x=>[x.siswa_id,x]));SS.cd=Object.fromEntries((b.data||[]).map(x=>[x.siswa_id,x]));}
}
function ui(){
 clearInterval(tm);
 app.innerHTML=`<div class=w><nav><button class="b s ${tab=='d'?'':'g'}" id=t1>Dasbor</button><button class="b s ${tab=='s'?'':'g'}" id=t2>Siswa &amp; Kartu</button><button class="b s ${tab=='k'?'':'g'}" id=t5>Kelompok &amp; Model</button><button class="b s ${tab=='b'?'':'g'}" id=t4>Bank Soal</button><button class="b s g" id=t3>Keluar</button></nav><div id=bd></div></div>`;
 $('#t1').onclick=()=>{tab='d';ui()};$('#t4').onclick=()=>{tab='b';ui()};$('#t5').onclick=()=>{tab='k';ui()};$('#t2').onclick=()=>{tab='s';ui()};
 $('#t3').onclick=async()=>{await sb.auth.signOut();login()};
 tab=='d'?dasbor():tab=='s'?siswaTab():tab=='k'?kel():bank();
 if(tab=='d'&&SS&&SS.status=='buka')tm=setInterval(async()=>{await muat();dasbor()},5000);
}
async function mulai(){const{error}=await sb.rpc('buat_sesi',{p_kelas_id:K.id});if(error)return alert(error.message);await muat();ui()}
function tanda(c){if(!c)return'';const t=[];
 if(c.ingin_bicara)t.push('💬');if(c.sarapan=='belum')t.push('🍽️');if(c.tidur=='sangat_kurang')t.push('😴');
 if(c.badan=='kurang_enak')t.push('🤒');if(c.perasaan_berangkat<=2||c.perasaan_sekarang<=2)t.push('☁️');if(c.semangat<=2)t.push('🪫');
 return t.join(' ')}
function dasbor(){
 const bd=$('#bd');
 if(!SS){bd.innerHTML='<div class=k><p>Belum ada sesi hari ini.</p><button class=b id=ms>▶ Mulai sesi hari ini</button></div>';$('#ms').onclick=mulai;return}
 const ln=location.origin+'/?s='+SS.kode_sesi,sd=SW.filter(s=>SS.ss[s.id]&&SS.ss[s.id].misi_selesai).length;
 bd.innerHTML=`<div class=k><p>Kode sesi (${SS.status})</p><div class=big>${SS.kode_sesi}</div><p>Tautan siswa: <b>${ln}</b></p><p><b>${sd}</b> dari ${SW.length} siswa selesai</p>${SS.status=='buka'?'<button class=b id=ts>⏹ Tutup sesi &amp; hitung profil</button>':'<button class="b g" id=ms>▶ Buka lagi</button>'}</div>
 <div class=k><table><tr><th>Siswa<th>Status<th>Perasaan<th>Penanda<th></tr>${SW.map(s=>{const t=SS.ss[s.id],c=SS.cd[s.id];
 return `<tr><td>${esc(s.nama)}<td>${!t?'—':t.misi_selesai?'✅ selesai':t.cek_diri_selesai?'⏳ misi':'✏️ cek diri'}<td>${c?E[c.perasaan_berangkat-1]+' ➜ '+E[c.perasaan_sekarang-1]:''}<td>${tanda(c)}<td>${t?`<button class="b s g" data-r="${s.id}" title="Buka ulang isian">↺</button>`:''}</tr>`}).join('')}</table>
 <small>💬 ingin bicara · 🍽️ belum sarapan · 😴 tidur kurang · 🤒 badan kurang enak · ☁️ murung · 🪫 semangat rendah (hanya terlihat oleh guru)</small></div>`;
 const ms=$('#ms'),ts=$('#ts');
 if(ms)ms.onclick=mulai;
 if(ts)ts.onclick=async()=>{const{data,error}=await sb.rpc('tutup_sesi',{p_sesi_id:SS.id});if(error)return alert(error.message);alert('Sesi ditutup. Profil harian dihitung untuk '+data+' siswa.');await muat();ui()};
 bd.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(confirm('Buka ulang isian siswa ini?')){await sb.rpc('reset_isian',{p_sesi_id:SS.id,p_siswa_id:b.dataset.r});await muat();dasbor()}});
}
function siswaTab(){
 $('#bd').innerHTML=`<div class=k><b>Tambah siswa</b> (satu nama per baris)<textarea id=nm rows=5></textarea><button class=b id=ad>Tambahkan</button></div><div class=k><button class=b id=pr>🖨 Cetak kartu semua siswa</button><table><tr><th>No<th>Nama<th>Kode kartu</tr>${SW.map(s=>`<tr><td>${s.no_absen??''}<td>${esc(s.nama)}<td><b>${s.kode_kartu}</b></tr>`).join('')}</table></div>`;
 $('#ad').onclick=async()=>{
  const n=$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!n.length)return;
  const a=Math.max(0,...SW.map(s=>s.no_absen||0));
  const{error}=await sb.from('siswa').insert(n.map((x,i)=>({kelas_id:K.id,nama:x,no_absen:a+i+1})));
  if(error)return alert(error.message);await muat();ui();};
 $('#pr').onclick=()=>{
  $('#kartu').innerHTML=SW.filter(s=>s.aktif).map(s=>{const q=qrcode(0,'M');q.addData(s.token_qr);q.make();
   return `<div class=kt><b>${esc(s.nama)}</b>${q.createSvgTag(4,0)}<div style="font:700 22px monospace;letter-spacing:3px">${s.kode_kartu}</div></div>`}).join('');
  print();};
}

/* ================= BANK SOAL ================= */
const PJ={literasi:'LITERASI: setiap soal punya "bacaan" berupa teks pendek 2-4 kalimat (cerita, informasi, atau pengumuman), lalu satu pertanyaan pemahaman tentang bacaan itu.',
numerasi:'NUMERASI: soal cerita satu langkah (penjumlahan, pengurangan, perkalian, pembagian, pecahan, persen, keliling/luas, atau membaca data sederhana). "bacaan" boleh kosong "".',
penalaran:'PENALARAN: soal logika atau pola sederhana (pola bilangan, urutan, sebab-akibat, mana yang tidak sesuai). "bacaan" boleh kosong "".'};
function promptSoal(j,t,n,tema){return `Kamu adalah penyusun soal asesmen diagnostik untuk siswa SD kelas 6 (Fase C, Kurikulum Merdeka) di Indonesia. Buatkan ${n} soal pilihan ganda jenis ${PJ[j]}

ATURAN:
- Tingkat kesulitan: ${t} (1 = mudah, 2 = sedang, 3 = menantang), setara untuk semua soal.
- Lintas mata pelajaran, bukan materi satu mapel tertentu.
- Tepat 4 opsi: 1 jawaban benar dan 3 pengecoh yang masuk akal. Letak jawaban benar harus bervariasi.
- "kunci" = nomor opsi yang benar, dimulai dari 0 (0 = opsi pertama, 3 = opsi keempat).
- Konteks wajar untuk anak SD Indonesia (nama, tempat, situasi sehari-hari), tanpa konten sensitif.
- ${tema?'Gunakan tema: '+tema+'.':'Variasikan tema (olahraga, game, hewan, alam, musik, teknologi, seni, memasak).'}
- Hitung ulang jawaban setiap soal sebelum menulis kunci. Jangan ada soal kembar.

FORMAT: keluarkan HANYA JSON array yang valid, tanpa teks lain dan tanpa tanda \`\`\`. Setiap elemen:
{"tema":"...","bacaan":"...","pertanyaan":"...","opsi":["...","...","...","..."],"kunci":0,"penjelasan":"satu kalimat alasan jawaban benar"}`}
async function setS(ids,s){const{error}=await sb.from('bank_soal').update({status:s}).in('id',ids);if(error)alert(error.message);bank()}
async function bank(){
 const{data:b}=await sb.from('bank_soal').select('*').order('dibuat_pada',{ascending:false});const B=b||[];
 const c=(j)=>B.filter(x=>x.jenis==j&&x.status=='disetujui').length,dr=B.filter(x=>x.status=='draf');
 $('#bd').innerHTML=`<div class=k><b>Soal disetujui</b><p>Literasi ${c('literasi')} · Numerasi ${c('numerasi')} · Penalaran ${c('penalaran')} · Draf menunggu tinjauan: ${dr.length}</p><small>Target awal: sekitar 30 per jenis.</small></div>
 <div class=k><b>1. Buat prompt</b><br><select id=bj><option>literasi<option>numerasi<option>penalaran</select> <select id=bt><option value=1>mudah<option value=2 selected>sedang<option value=3>menantang</select> <input id=bn type=number value=20 min=5 max=30 style="width:90px"><input id=bm placeholder="Tema (opsional)"><button class=b id=bp>📋 Salin prompt</button><small>Tempel ke Gemini, ChatGPT, atau Claude.</small></div>
 <div class=k><b>2. Tempel hasil AI (JSON)</b><textarea id=bh rows=6></textarea><button class=b id=bs>Periksa &amp; simpan sebagai draf</button></div>
 <div class=k><b>3. Tinjau draf</b> <small>(periksa kunci jawaban ✅, terutama numerasi)</small>${dr.length?'<button class="b g" id=ba>Setujui semua draf yang tampil</button>':'<p>Tidak ada draf.</p>'}${dr.slice(0,20).map(x=>`<div class=k><small>${x.jenis} · tingkat ${x.tingkat}</small>${x.bacaan?`<p><i>${esc(x.bacaan)}</i></p>`:''}<p><b>${esc(x.pertanyaan)}</b></p>${x.opsi.map((o,i)=>`<div>${i==x.kunci?'✅':'▫️'} ${esc(o)}</div>`).join('')}<small>${esc(x.penjelasan||'')}</small><br><button class="b s" data-a="${x.id}">Setujui</button><button class="b s g" data-d="${x.id}">Buang</button></div>`).join('')}</div>`;
 $('#bp').onclick=()=>navigator.clipboard.writeText(promptSoal($('#bj').value,$('#bt').value,$('#bn').value,$('#bm').value.trim())).then(()=>alert('Prompt disalin. Tempel ke AI pilihan Anda.'));
 $('#bs').onclick=async()=>{let a;
  try{a=JSON.parse($('#bh').value.replace(/^```(json)?|```$/gm,'').trim())}catch(e){return alert('JSON tidak terbaca. Minta AI mengulang dengan JSON saja.')}
  if(!Array.isArray(a))return alert('Harus berupa array JSON.');
  const j=$('#bj').value,t=+$('#bt').value,ok=[];
  a.forEach(x=>{if(x&&x.pertanyaan&&Array.isArray(x.opsi)&&x.opsi.length==4&&new Set(x.opsi).size==4&&Number.isInteger(x.kunci)&&x.kunci>=0&&x.kunci<4)ok.push({jenis:j,tingkat:t,tema:x.tema||null,bacaan:x.bacaan||null,pertanyaan:String(x.pertanyaan),opsi:x.opsi.map(String),kunci:x.kunci,penjelasan:x.penjelasan||null})});
  let n=0;for(const r of ok){const{error}=await sb.from('bank_soal').insert(r);if(!error)n++}
  alert(n+' dari '+a.length+' soal disimpan sebagai draf. Sisanya ditolak (format salah atau soal kembar).');bank()};
 const ba=$('#ba');if(ba)ba.onclick=()=>setS(dr.slice(0,20).map(x=>x.id),'disetujui');
 $('#bd').querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>setS([e.dataset.a],'disetujui'));
 $('#bd').querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>setS([e.dataset.d],'dibuang'));
}

/* ================= KELOMPOK & MODEL ================= */
const NM=['Elang','Harimau','Lumba-lumba','Rajawali','Singa','Kuda Laut','Macan Tutul','Gajah','Beruang','Kancil'];
let G=null,PK=null,SHOW=false;
function susun(H,jenis){
 const g=Math.max(1,Math.round(H.length/5)),s=[...H].sort((a,b)=>b.skor-a.skor);
 if(jenis=='homogen'){const k=Math.ceil(s.length/g);return Array.from({length:g},(_,i)=>s.slice(i*k,(i+1)*k)).filter(x=>x.length)}
 const gr=Array.from({length:g},()=>[]);
 s.forEach((h,i)=>{const r=Math.floor(i/g),p=i%g;gr[r%2?g-1-p:p].push(h)});
 const M=H.reduce((t,h)=>t+h.skor,0)/H.length;
 const cost=()=>gr.reduce((t,x)=>{if(!x.length)return t;const m=x.reduce((a,h)=>a+h.skor,0)/x.length;
  return t+(m-M)**2+(x.some(h=>h.kol==3)?0:300)+150*Math.max(0,x.filter(h=>h.murung).length-1)+100*Math.max(0,x.filter(h=>h.khusus).length-1)},0);
 let c=cost();
 for(let t=0;t<4000&&g>1;t++){
  const a=Math.floor(Math.random()*g),b=Math.floor(Math.random()*g);if(a==b)continue;
  const i=Math.floor(Math.random()*gr[a].length),j=Math.floor(Math.random()*gr[b].length);
  [gr[a][i],gr[b][j]]=[gr[b][j],gr[a][i]];const n=cost();
  if(n<=c)c=n;else[gr[a][i],gr[b][j]]=[gr[b][j],gr[a][i]];}
 return gr;
}
function gambarKel(){
 if(!G)return;const rata=x=>Math.round(x.reduce((a,h)=>a+h.skor,0)/x.length);
 $('#gk').innerHTML=`<label><input type=checkbox id=lv ${SHOW?'checked':''} style="width:auto"> Tampilkan level (jangan dicentang saat layar IFP dilihat siswa)</label>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">${G.gr.map((x,i)=>{const m=rata(x);
 return `<div class=k><b>Kelompok ${NM[i]}</b>${SHOW&&G.jenis=='homogen'?`<br><small>${m<50?'lebih terbimbing, prioritas bantuan guru':m<80?'tugas standar':'tantangan pengayaan'}</small>`:''}${x.map(h=>`<div>${esc(h.nama)}${SHOW?` <small>(${h.level})</small>`:''}</div>`).join('')}</div>`}).join('')}</div>
 <button class=b id=sv>💾 Simpan kelompok ini</button>`;
 $('#lv').onchange=e=>{SHOW=e.target.checked;gambarKel()};
 $('#sv').onclick=async()=>{await sb.from('kelompok').delete().eq('sesi_id',SS.id);
  for(const[i,x]of G.gr.entries()){const{data}=await sb.from('kelompok').insert({sesi_id:SS.id,nama:NM[i],jenis:G.jenis}).select().single();
   await sb.from('anggota_kelompok').insert(x.map(h=>({kelompok_id:data.id,siswa_id:h.id})))}
  alert('Kelompok disimpan.')};
}
async function kel(){
 const bd=$('#bd');bd.innerHTML='<div class=k>Menghitung profil kelas…</div>';
 await muat();
 if(!SS||!Object.keys(SS.cd).length){bd.innerHTML='<div class=k>Belum ada siswa yang mengisi sesi hari ini. Mulai sesi di Dasbor dulu.</div>';return}
 await sb.rpc('hitung_profil',{p_sesi_id:SS.id});
 const[a,b]=await Promise.all([sb.from('profil_harian').select('*').eq('sesi_id',SS.id),sb.from('catatan_guru').select('*')]);
 const pf=Object.fromEntries((a.data||[]).map(x=>[x.siswa_id,x])),ct=Object.fromEntries((b.data||[]).map(x=>[x.siswa_id,x]));
 const H=SW.filter(s=>SS.cd[s.id]).map(s=>{const c=SS.cd[s.id],p=pf[s.id]||{},g=ct[s.id]||{};
  return{id:s.id,nama:s.nama,skor:p.skor_gabungan??50,level:p.level||'cakap',kol:g.kolaborasi||2,khusus:!!(g.kebutuhan_khusus&&g.kebutuhan_khusus.trim()),murung:c.perasaan_berangkat<=2||c.perasaan_sekarang<=2,c}});
 const n=H.length,pct=f=>Math.round(100*H.filter(f).length/n),avg=f=>H.reduce((t,h)=>t+f(h),0)/n;
 const M=avg(h=>h.skor),sd=Math.sqrt(avg(h=>(h.skor-M)**2)),gy=g=>pct(h=>h.c.gaya_belajar==g),kb=k=>pct(h=>h.c.kebutuhan_hari_ini==k);
 const sem=avg(h=>h.c.semangat),lowE=sem<3||pct(h=>h.c.sarapan=='belum'||h.c.tidur=='sangat_kurang')>=30,kolT=pct(h=>h.kol==3);
 const top=k=>{const m={};H.forEach(h=>[].concat(h.c[k]).forEach(v=>m[v]=(m[v]||0)+1));return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,3).map(e=>e[0])};
 const md=(nama,sk,al,j)=>({nama,sk,al,j});
 const R=[
  md('TaRL (pengajaran sesuai level)',sd/9,`sebaran kemampuan lebar (simpangan ${Math.round(sd)})`,'homogen'),
  md('Pembelajaran terbimbing (demonstrasi lalu praktik)',kb('dibantu')/15+(lowE?2:0),`${kb('dibantu')}% ingin dibantu pelan-pelan${lowE?', energi kelas rendah':''}`,'homogen'),
  md('PjBL / Discovery',gy('mencoba_langsung')/12+(sem>=3.5?1:0),`${gy('mencoba_langsung')}% ingin mencoba langsung`,'heterogen'),
  md('Game-based Learning / TGT',(gy('bermain')+kb('bermain'))/20,`${gy('bermain')}% ingin bermain`,'heterogen'),
  md('Rotasi stasiun aktif',gy('bergerak')/10,`${gy('bergerak')}% ingin bergerak`,'heterogen'),
  md('PBL / Jigsaw / Diskusi kelompok',gy('berdiskusi')/12+pct(h=>h.c.preferensi_kerja=='kelompok')/25+(sem>=3.5&&kolT>30?1.5:0),`${gy('berdiskusi')}% ingin berdiskusi, semangat rata-rata ${sem.toFixed(1)}`,'heterogen')
 ].sort((x,y)=>y.sk-x.sk).slice(0,3);
 const mrg=pct(h=>h.murung),buka=mrg>=25||avg(h=>h.c.perasaan_sekarang)<3?'Pembuka menenangkan: tarik napas 1 menit, berbagi perasaan lewat ikon, lalu aktivitas ringan.':'Pembuka menggembirakan: permainan singkat bertema favorit kelas.';
 PK={n,sd:Math.round(sd),gaya:top('gaya_belajar'),tema:top('tema_favorit'),semangat:sem.toFixed(1),murung:mrg,belumSarapan:pct(h=>h.c.sarapan=='belum'),lv:{berkembang:pct(h=>h.level=='berkembang'),cakap:pct(h=>h.level=='cakap'),mahir:pct(h=>h.level=='mahir')},buka,model:R[0].nama,jenis:R[0].j};
 bd.innerHTML=`<div class=k><b>Profil kelas hari ini</b> (${n} siswa hadir)<p>Level: berkembang ${PK.lv.berkembang}% · cakap ${PK.lv.cakap}% · mahir ${PK.lv.mahir}%<br>Semangat rata-rata ${PK.semangat}/5 · murung ${mrg}% · belum sarapan ${PK.belumSarapan}%<br>Gaya belajar terbanyak: ${PK.gaya.join(', ')} · Tema favorit: ${PK.tema.join(', ')}</p><p>💡 ${buka}</p></div>
 <div class=k><b>Model pembelajaran yang disarankan</b>${R.map((r,i)=>`<label style="display:block;margin:8px 0"><input type=radio name=md style="width:auto" value="${i}" ${i?'':'checked'}> <b>${r.nama}</b><br><small>Karena ${r.al}. Kelompok disarankan: ${r.j}</small></label>`).join('')}
 <b>Jenis kelompok</b><br><label><input type=radio name=jn value=heterogen style="width:auto" ${R[0].j=='heterogen'?'checked':''}> Heterogen</label> <label><input type=radio name=jn value=homogen style="width:auto" ${R[0].j=='homogen'?'checked':''}> Homogen</label>
 <button class=b id=sk>🎲 Susun kelompok</button></div><div id=gk></div>`;
 bd.querySelectorAll('[name=md]').forEach(e=>e.onchange=()=>{const r=R[+e.value];PK.model=r.nama;PK.jenis=r.j;bd.querySelector(`[name=jn][value=${r.j}]`).checked=true});
 $('#sk').onclick=()=>{const j=bd.querySelector('[name=jn]:checked').value;PK.jenis=j;G={jenis:j,gr:susun(H,j)};gambarKel()};
}

(P.has('s')?masuk:guru)();
</script></body></html>
